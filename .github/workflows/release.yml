name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Version déjà publiée à la main (premier publish depuis le poste) : rien à faire.
      - name: Déjà publiée ?
        id: published
        run: echo "done=$(npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.done == ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          target: base
          push: true
          tags: |
            ghcr.io/branlii/claude-pwa-base:${{ steps.v.outputs.version }}
            ghcr.io/branlii/claude-pwa-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./docker
          target: voice
          push: true
          tags: |
            ghcr.io/branlii/claude-pwa-base:${{ steps.v.outputs.version }}-voice-fr
            ghcr.io/branlii/claude-pwa-base:latest-voice-fr
          cache-from: type=gha
          cache-to: type=gha,mode=max
